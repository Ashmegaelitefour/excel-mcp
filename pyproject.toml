[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "excel-mcp"
version = "0.1.0"
description = "MCP server for querying and transforming Excel, CSV, TSV and Parquet files with Polars"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["mcp", "excel", "polars", "etl", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp[cli]",
    "mcp",
    "polars>=1.0",
    "fastexcel>=0.11",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.scripts]
excel-mcp = "excel_mcp.server:main"

[project.urls]
Homepage = "https://github.com/your-org/excel-mcp"
Issues = "https://github.com/your-org/excel-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/excel_mcp"]
